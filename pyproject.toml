[project]
name = "nanoact"
version = "0.1.0.dev0"
description = "A compact, single-camera ACT implementation adapted from LeRobot"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0 AND BSD-3-Clause"
license-files = ["LICENSE", "licenses/*.txt", "THIRD_PARTY.md"]
dependencies = [
    "numpy==2.2.6",
    "torch==2.11.0",
    "torchvision==0.26.0",
]

[project.optional-dependencies]
data = [
    "huggingface-hub==1.24.0",
    "pyarrow==25.0.0",
    "torchcodec==0.11.1",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nanoact"]

[tool.hatch.build.targets.sdist]
include = ["nanoact/", "tests/", "README.md", "THIRD_PARTY.md", "LICENSE", "licenses/", "pyproject.toml", "uv.lock", ".python-version"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
